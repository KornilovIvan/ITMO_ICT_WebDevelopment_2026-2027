{% extends 'base.html' %}
{% block title %}Удалить автомобиль{% endblock %}
{% block content %}
  <h1>Удалить «{{ car }}»?</h1>
  <form method="post" class="panel">
    {% csrf_token %}
    <button type="submit">Да, удалить</button>
    <a href="{% url 'car_detail' car.pk %}">Отмена</a>
  </form>
{% endblock %}
