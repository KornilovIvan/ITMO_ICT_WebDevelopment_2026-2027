{% extends 'base.html' %}
{% block title %}Новый владелец{% endblock %}
{% block content %}
  <h1>Новый владелец</h1>
  <form method="post" class="panel">
    {% csrf_token %}
    {{ form.non_field_errors }}
    {% for field in form %}
      <label for="{{ field.id_for_label }}">{{ field.label }}</label>
      {{ field }}
      {{ field.errors }}
    {% endfor %}
    <button type="submit">Сохранить</button>
  </form>
{% endblock %}
