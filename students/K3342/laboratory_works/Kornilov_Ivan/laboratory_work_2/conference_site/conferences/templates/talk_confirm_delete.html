{% extends "base.html" %}
{% block title %}Удалить заявку{% endblock %}
{% block content %}
<h1>Удалить заявку</h1>
<p>Удалить доклад «{{ talk.talk_title }}» на конференции «{{ talk.conference.title }}»?</p>
<form method="post">
  {% csrf_token %}
  <button type="submit">Удалить</button>
  <a href="{% url 'my_talks' %}">Отмена</a>
</form>
{% endblock %}
